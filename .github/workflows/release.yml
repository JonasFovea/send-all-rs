name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: send-all-rs

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            binary: send-all-rs

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: send-all-rs.exe

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            binary: send-all-rs.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir release

          cp target/${{ matrix.target }}/release/${{ matrix.binary }} release/

          cd release

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a ../send-all-rs-${{ matrix.target }}.zip *
          else
            tar czf ../send-all-rs-${{ matrix.target }}.tar.gz *
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            send-all-rs-*